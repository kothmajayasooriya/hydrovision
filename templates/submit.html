{% extends "base.html" %}
{% block title %}Log a Test - HydroVision{% endblock %}

{% block content %}
  <h1 class="section-title" style="justify-content:center;">💧 Log a Water Test</h1>
  <p class="section-sub" style="text-align:center;">Enter the raw measurements below - HydroVision will calculate the Water Quality Index automatically. Not sure what a reading means? Visit the <a href="{{ url_for('learn') }}">Learn hub</a> first.</p>

  <form method="POST" enctype="multipart/form-data" class="panel">
    <label for="location_name">Location Name</label>
    <div class="autocomplete-wrapper">
      <input type="text" id="location_name" name="location_name" placeholder="e.g. Kelaniya River, Colombo" required
             autocomplete="off" data-autocomplete="location"
             data-lat-field="latitude" data-lng-field="longitude">
    </div>

    <label for="source_type">Water Source Type</label>
    <select id="source_type" name="source_type" required>
      <option value="Well">Well</option>
      <option value="Tap">Tap / Municipal supply</option>
      <option value="River">River / Stream</option>
      <option value="Lake">Lake / Reservoir</option>
      <option value="Rainwater">Rainwater tank</option>
    </select>

    <label for="ph">pH level (0-14) — <a href="{{ url_for('learn') }}#ph">what's safe?</a></label>
    <input type="number" id="ph" name="ph" step="0.001" min="0" max="14" required>

    <label for="turbidity">Turbidity (NTU) — <a href="{{ url_for('learn') }}#turbidity">learn more</a></label>
    <input type="number" id="turbidity" name="turbidity" step="0.001" min="0" required>

    <label for="tds">Total Dissolved Solids (mg/L) — <a href="{{ url_for('learn') }}#tds">learn more</a></label>
    <input type="number" id="tds" name="tds" step="0.001" min="0" required>

    <label for="nitrates">Nitrates (mg/L) — <a href="{{ url_for('learn') }}#nitrates">learn more</a></label>
    <input type="number" id="nitrates" name="nitrates" step="0.001" min="0" required>

    <label for="latitude">Latitude (optional — auto-fills when you pick a suggested location)</label>
    <input type="number" id="latitude" name="latitude" step="0.000001">

    <label for="longitude">Longitude (optional)</label>
    <input type="number" id="longitude" name="longitude" step="0.000001">

    <!--
      capture="environment" opens the rear camera directly on mobile devices
      when the user taps this field, letting them photograph their sample or
      test strip as evidence. On desktop it just falls back to a normal file
      picker - no JavaScript required for the capture itself.
    -->
    <label for="photo">Evidence Photo (optional - use your camera)</label>
    <input type="file" id="photo" name="photo" accept="image/*" capture="environment">

    <button type="submit" class="btn btn-primary" style="width:100%; margin-top:1.5rem;">Submit &amp; Calculate WQI</button>
  </form>
{% endblock %}
