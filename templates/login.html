{% extends "base.html" %}
{% block title %}Login - HydroVision{% endblock %}

{% block content %}
  <div style="text-align:center; margin-bottom:1rem;">
    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="HydroVision logo" style="width:72px; height:72px; border-radius:50%; box-shadow:var(--shadow);">
  </div>
  <h1 style="text-align:center; color: var(--dark-blue);">Welcome Back</h1>
  <form method="POST" class="panel">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>

    <button type="submit" class="btn btn-primary" style="width:100%; margin-top:1.5rem;">Log In</button>
  </form>
  <p style="text-align:center; margin-top:1rem;">No account yet? <a href="{{ url_for('register') }}">Register</a></p>
{% endblock %}
